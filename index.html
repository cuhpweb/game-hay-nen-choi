<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hay Nên Chơi — Tổng Hợp Link Tải Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b14;
      --card: #111827;
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --accent-2: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(34, 211, 238, 0.14), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.14), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 64px;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    .profile {
      text-align: center;
      margin-bottom: 24px;
    }
    .avatar {
      width: 76px;
      height: 76px;
      margin: 0 auto 12px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 12px 32px rgba(34, 211, 238, 0.25);
    }
    .profile h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }
    .profile p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }
    .updated-note {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
    }
    .controls {
      position: sticky;
      top: 10px;
      z-index: 20;
      background: rgba(7, 11, 20, 0.9);
      backdrop-filter: blur(12px);
      padding: 12px;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      margin-bottom: 20px;
    }
    .search-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #1e293b;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
    }
    .filters {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .filter-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .filter-btn.active {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(168, 85, 247, 0.2));
      border-color: var(--accent);
      color: #fff;
    }
    .week-section {
      margin-bottom: 20px;
      border-radius: 20px;
      background: rgba(17, 24, 39, 0.65);
      border: 1px solid var(--card-border);
      padding: 14px;
    }
    .week-header {
      list-style: none;
      cursor: pointer;
      padding-bottom: 10px;
    }
    .week-header::-webkit-details-marker { display: none; }
    .week-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .new-pill {
      padding: 3px 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #061018;
      font-size: 11px;
      font-weight: 800;
    }
    .week-label {
      font-size: 17px;
      font-weight: 800;
    }
    .week-date {
      font-size: 12px;
      color: var(--muted);
    }
    .week-theme {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .game-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .game-card.hidden {
      display: none;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .day-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
    }
    .platform-chip {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .badge-pc {
      background: rgba(34, 211, 238, 0.14);
      color: #67e8f9;
    }
    .badge-mobile {
      background: rgba(251, 113, 133, 0.16);
      color: #fda4af;
    }
    .game-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .game-genre {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }
    .game-desc {
      font-size: 13.5px;
      line-height: 1.5;
      color: #cbd5e1;
    }
    .cta-link {
      margin-top: 4px;
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #050a12;
      font-weight: 800;
      font-size: 14px;
      transition: transform 0.12s ease;
    }
    .cta-link:active {
      transform: scale(0.98);
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="profile">
      <div class="avatar">🎮</div>
      <h1>Game Hay Nên Chơi</h1>
      <p>Tổng hợp link tải chính thức các tựa game PC &amp; Mobile chọn lọc mỗi tuần</p>
      
    </header>

    <section class="controls">
      <input id="searchInput" class="search-input" type="search" placeholder="🔍 Tìm nhanh tên game (VD: Balatro, Dredge...)" />
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Tất cả</button>
        <button class="filter-btn" data-filter="pc">💻 PC</button>
        <button class="filter-btn" data-filter="mobile">📱 Mobile</button>
      </div>
    </section>

    <section id="weeksContainer">
      <div class="empty-state">Chưa có game nào được cập nhật. Hãy chạy hệ thống để xuất danh sách tuần đầu tiên!</div>
    </section>
  </main>

  <script>
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    let currentFilter = 'all';

    function applyFilters() {
      const q = (searchInput.value || '').trim().toLowerCase();
      document.querySelectorAll('.game-card').forEach(card => {
        const matchPlatform = currentFilter === 'all' || card.dataset.platform === currentFilter;
        const matchSearch = !q || (card.dataset.search || '').includes(q);
        card.classList.toggle('hidden', !(matchPlatform && matchSearch));
      });
      document.querySelectorAll('.week-section').forEach(sec => {
        const visible = sec.querySelectorAll('.game-card:not(.hidden)').length;
        sec.style.display = visible > 0 ? '' : 'none';
      });
    }

    searchInput.addEventListener('input', applyFilters);
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        applyFilters();
      });
    });
  </script>
</body>
</html>
